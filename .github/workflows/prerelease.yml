name: Prerelease

on:
  push:
    branches:
      - main
    paths:
      - 'release/prerelease.json'
      - 'package.json'
      - '.github/workflows/prerelease.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Prerelease tag, for example v0.1.0-preview.1
        required: true
        default: v0.1.0-preview.1

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve and validate release version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="${{ github.event.inputs.release_tag }}"
          else
            TAG="$(jq -r '.tag' release/prerelease.json)"
          fi

          if [[ ! "$TAG" =~ ^v0\.1\.0-preview\.[0-9]+$ ]]; then
            echo "Unsupported prerelease tag: $TAG" >&2
            exit 1
          fi

          VERSION="${TAG#v}"
          PACKAGE_VERSION="$(jq -r '.version' package.json)"
          PACKAGE_NAME="$(jq -r '.name' package.json)"
          PACKAGE_LICENSE="$(jq -r '.license' package.json)"
          MANIFEST_VERSION="$(jq -r '.version' release/prerelease.json)"
          MANIFEST_TAG="$(jq -r '.tag' release/prerelease.json)"
          MANIFEST_PACKAGE="$(jq -r '.npmPackage' release/prerelease.json)"
          MANIFEST_LICENSE="$(jq -r '.license' release/prerelease.json)"

          if [[ "$PACKAGE_VERSION" != "$VERSION" || "$MANIFEST_VERSION" != "$VERSION" ]]; then
            echo "Release version mismatch for $VERSION." >&2
            exit 1
          fi
          if [[ "$MANIFEST_TAG" != "$TAG" ]]; then
            echo "Release tag mismatch: expected $TAG, manifest has $MANIFEST_TAG" >&2
            exit 1
          fi
          if [[ "$PACKAGE_NAME" != "@dihor/gamekit-board" || "$MANIFEST_PACKAGE" != "$PACKAGE_NAME" ]]; then
            echo "Unexpected npm package name." >&2
            exit 1
          fi
          if [[ "$PACKAGE_LICENSE" != "MIT" || "$MANIFEST_LICENSE" != "MIT" ]]; then
            echo "Prerelease must declare MIT license." >&2
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.12
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build library
        run: npm run build

      - name: Typecheck demo
        run: npm run typecheck:demo

      - name: Build demo
        run: npm run build:demo

      - name: Validate package license files
        shell: bash
        run: |
          test -f LICENSE
          test -f THIRD_PARTY_NOTICES.md
          test -f README.md
          test -f CHANGELOG.md
          test "$(jq -r '.license' package.json)" = "MIT"

      - name: Pack npm prerelease
        shell: bash
        run: |
          mkdir -p artifacts/npm
          npm pack --pack-destination artifacts/npm
          PACKAGE="$(find artifacts/npm -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          if [[ -z "$PACKAGE" ]]; then
            echo "No npm package was produced." >&2
            exit 1
          fi

          test "$(tar -xOf "$PACKAGE" package/package.json | jq -r '.version')" = "${{ steps.version.outputs.version }}"
          test "$(tar -xOf "$PACKAGE" package/package.json | jq -r '.name')" = "@dihor/gamekit-board"
          test "$(tar -xOf "$PACKAGE" package/package.json | jq -r '.license')" = "MIT"

          tar -tzf "$PACKAGE" > package-files.txt
          grep -q '^package/dist/' package-files.txt
          for FILE in README.md CHANGELOG.md LICENSE THIRD_PARTY_NOTICES.md; do
            grep -q "^package/$FILE$" package-files.txt
          done

      - name: Create checksums
        shell: bash
        run: |
          PACKAGE="$(find artifacts/npm -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          PACKAGE_NAME="$(basename "$PACKAGE")"
          (
            cd artifacts/npm
            sha256sum "$PACKAGE_NAME"
          ) > artifacts/SHA256SUMS.txt
          (
            cd artifacts/npm
            sha256sum -c ../SHA256SUMS.txt
          )

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dihor-gamekit-board-${{ steps.version.outputs.version }}
          path: artifacts/
          if-no-files-found: error

      - name: Create GitHub prerelease
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          TITLE="Dihor.GameKit.Board $VERSION"
          PACKAGE="$(find artifacts/npm -maxdepth 1 -type f -name '*.tgz' -print -quit)"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to replace published package bytes." >&2
            exit 1
          fi

          gh release create "$TAG" "$PACKAGE" artifacts/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --prerelease \
            --generate-notes \
            --title "$TITLE"

          test "$(gh release view "$TAG" --json name --jq '.name')" = "$TITLE"
          test "$(gh release view "$TAG" --json isPrerelease --jq '.isPrerelease')" = "true"

          PACKAGE_ASSET="$(basename "$PACKAGE")"
          mapfile -t ACTUAL_ASSETS < <(
            gh release view "$TAG" --json assets --jq '.assets[].name' | sort
          )
          mapfile -t EXPECTED_ASSETS < <(
            printf '%s\n' "$PACKAGE_ASSET" "SHA256SUMS.txt" | sort
          )
          if [[ "${ACTUAL_ASSETS[*]}" != "${EXPECTED_ASSETS[*]}" ]]; then
            echo "Unexpected release asset set." >&2
            exit 1
          fi
